<!DOCTYPE html>
<html>
<head>
  <meta name="aui-viewport" content="mode=gui">
  <link rel="stylesheet" href="../banira_codex/shared.css">
  <link rel="stylesheet" href="lottery.css">
  <link rel="stylesheet" href="sakura-lottery.css">
</head>
<body class="sakura-ui">
<main id="window" class="page lottery">
  <header class="header notification-toolbar">
    <div id="brand" class="glyph"></div>
    <div class="lottery-heading"><div id="title" class="title"></div><div id="policy" class="label"></div></div>
    <button id="close" class="tool"><div id="close_icon" class="glyph"></div></button>
  </header>
  <div class="notification-columns lottery-body">
    <aside class="notification-list pool-rail">
      <div id="pool_label" class="label"></div>
      <div id="pool_scroll" class="content"><div id="pool_rows"></div></div>
    </aside>
    <section class="notification-details pool-detail">
      <div class="notification-columns feature">
        <div class="notification-details pool-copy">
          <div id="time"><div id="time_label" class="label"></div><div id="time_value"></div></div>
          <div id="detail" class="content"><div id="description"></div></div>
          <div class="feature-tools">
            <button id="details"></button>
            <div id="featured_0" class="featured-icon"></div>
            <div id="featured_1" class="featured-icon"></div>
            <div id="featured_2" class="featured-icon"></div>
          </div>
        </div>
        <div class="artwork"><div id="poster"></div></div>
      </div>
    </section>
  </div>
  <footer id="draw_bar" class="billing footer">
    <div class="fee-group"><div id="available"></div><div id="fee_detail"><div id="fee_icon"></div><div id="fee"></div></div><div id="info" class="label"></div></div>
    <div id="single_slot"><button id="single"><div id="single_label"></div></button></div>
    <div id="batch_slot" class="editor"><div id="batch_picker"><input id="batch_count" readonly></div><button id="batch" class="primary"><div id="batch_label"></div></button></div>
  </footer>
  <div id="details_panel" class="lottery-modal" aria-modal="true" disabled>
    <section class="lottery-dialog">
      <div class="caption"><div id="preview_title"></div><div id="preview_count" class="label"></div><button id="details_close"></button></div>
      <section id="content" class="content">
        <div id="empty" class="label"></div>
        <div id="fields"></div>
      </section>
    </section>
  </div>
  <div id="confirm_panel" class="lottery-modal" aria-modal="true" disabled>
    <section class="lottery-dialog">
      <div id="confirm_title" class="title"></div>
      <div id="confirm_draw_count"></div>
      <div id="confirm_fee" class="label"></div>
      <div class="dialog-actions"><button id="confirm_cancel"></button><button id="confirm_draw" class="primary"></button></div>
    </section>
  </div>
</main>
</body>
</html>
