buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

def javaVer = 21

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            // args '--nogui' // 不禁用gui方便指令调试
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

def baniraCodexCoords = "xin.vanilla.banira:banira_codex:${loader_type}-${minecraft_version}-${banira_version}"

configurations {
    // 胖包合并 Maven Local 中已经 reobf 的 Banira，避免重复 remap。
    baniraCodexObf {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

repositories {
    mavenLocal()
}

apply from: "gradle/banira-local-fingerprint.gradle"

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation 'junit:junit:4.13.2'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation(fg.deobf(baniraCodexCoords)) {
        changing = true
    }
    baniraCodexObf(baniraCodexCoords) {
        changing = true
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            loader_type            : loader_type,
            banira_version_range   : banira_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// 胖包资源包含 Banira 的模组声明，瘦包仅声明依赖。
tasks.register('prepareFatResources') {
    dependsOn 'processResources'
    inputs.dir(layout.buildDirectory.dir('resources/main'))
    inputs.property('banira_embed_mods_toml',
            "${banira_version}|${minecraft_version}|${forge_version_range}|${minecraft_version_range}")
    outputs.dir(layout.buildDirectory.dir('fatResources/main'))
    doLast {
        copy {
            from layout.buildDirectory.dir('resources/main')
            into layout.buildDirectory.dir('fatResources/main')
        }
        def modsToml = layout.buildDirectory.file('fatResources/main/META-INF/mods.toml').get().asFile
        if (!modsToml.isFile()) {
            throw new GradleException('fatResources: META-INF/mods.toml missing')
        }
        modsToml.append("""
[[mods]]
    modId = "banira_codex"
    version = "${banira_version}"
    displayName = "香草志(Banira Codex)"
    updateJSONURL = "https://update.mc.vanilla.xin/banira_codex/forge/${minecraft_version}"
    displayURL = "https://mc.vanilla.xin/banira_codex"
    authors = "Tsuki Maaii"
    description = ''''''
    clientRequired = false
[[dependencies."banira_codex"]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."banira_codex"]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
""".stripIndent(), 'UTF-8')
    }
}

def modsJarVersion = "${loader_type}-${minecraft_version}-${mod_version}"
def modsDestinationDir = file("${projectDir}/builds/${mod_version}")

tasks.named('jar', Jar).configure {
    // 瘦包不包含 Banira 字节码。
    archiveBaseName.set(mod_id)
    archiveVersion.set(modsJarVersion)
    destinationDirectory.set(modsDestinationDir)

    manifest {
        attributes([
                "Specification-Title"       : mod_id,
                "Specification-Vendor"      : mod_authors,
                "Specification-Version"     : "1",
                "Implementation-Title"      : project.name,
                "Implementation-Version"    : project.jar.archiveVersion,
                "Implementation-Vendor"     : mod_authors,
                "Implementation-Timestamp"  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"              : "${mod_id}.mixins.json",
        ])
    }

    finalizedBy 'reobfJar'
}

// 胖包合并双方已 reobf 的产物，不再执行第二次 remap。
tasks.register('jarAll', Jar) {
    archiveBaseName.set(mod_id)
    archiveVersion.set(modsJarVersion)
    archiveClassifier.set('all')
    destinationDirectory.set(modsDestinationDir)

    dependsOn 'reobfJar', 'prepareFatResources', configurations.named('baniraCodexObf')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def slimJar = tasks.named('jar', Jar)
    from {
        zipTree(slimJar.get().archiveFile.get().asFile)
    } {
        exclude 'META-INF/mods.toml'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
    }
    from(layout.buildDirectory.file('fatResources/main/META-INF/mods.toml')) {
        into 'META-INF'
    }
    from {
        zipTree(configurations.baniraCodexObf.singleFile)
    } {
        exclude 'META-INF/mods.toml'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
    }

    manifest {
        attributes([
                "Specification-Title"       : mod_id,
                "Specification-Vendor"      : mod_authors,
                "Specification-Version"     : "1",
                "Implementation-Title"      : project.name,
                "Implementation-Version"    : "${modsJarVersion}-all",
                "Implementation-Vendor"     : mod_authors,
                "Implementation-Timestamp"  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"              : "${mod_id}.mixins.json, banira_codex.mixins.json",
        ])
    }
}

tasks.named('assemble').configure {
    dependsOn 'jarAll'
}

afterEvaluate {
    tasks.named('jar', Jar).configure {
        manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
    }
    tasks.named('jarAll', Jar).configure {
        manifest.attributes(
                'MixinConfigs': "${mod_id}.mixins.json, banira_codex.mixins.json"
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Merge the resources and classes into the same directory.
// This is done because java expects modules to be in a single directory.
// And if we have it in multiple we have to do performance intensive hacks like having the UnionFileSystem
// This will eventually be migrated to ForgeGradle so modders don't need to manually do it. But that is later.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
