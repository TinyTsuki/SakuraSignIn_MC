plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.181'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }
    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

def baniraArtifactVersionRange = "${banira_version_range}"
def baniraCodexCoords = "xin.vanilla.banira:banira_codex:${loader_type}-${minecraft_version}-${banira_version}"

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

repositories {
    mavenLocal()
    mavenCentral()
}

apply from: 'gradle/banira-local-fingerprint.gradle'

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    testImplementation 'junit:junit:4.13.2'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation(baniraCodexCoords) {
        changing = true
    }
    jarJar(baniraCodexCoords) {
        changing = true
        jarJar.ranged(it, baniraArtifactVersionRange)
    }
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            loader_type            : loader_type,
            banira_version_range   : banira_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

apply from: 'gradle/mixin-runtime.gradle'

def modsJarVersion = "${loader_type}-${minecraft_version}-${mod_version}"
def modsDestinationDir = file("${projectDir}/builds/${mod_version}")

tasks.named('jar', Jar).configure {
    archiveBaseName.set(mod_id)
    archiveVersion.set(modsJarVersion)
    destinationDirectory.set(modsDestinationDir)
    manifest {
        attributes([
                'Implementation-Title'  : project.name,
                'Implementation-Version': modsJarVersion
        ])
    }
}

tasks.register('jarAll') {
    group = 'build'
    description = 'Builds the NeoForge JarJar artifact and copies it to builds.'
}

afterEvaluate {
    def fatTask = tasks.findByName('reobfJarJar') ?: tasks.findByName('jarJar')
    if (fatTask == null) {
        throw new GradleException('NeoForge JarJar task is unavailable')
    }
    fatTask.doLast {
        File fatJar = fatTask.name == 'reobfJarJar'
                ? layout.buildDirectory.file('reobfJarJar/output.jar').get().asFile
                : fatTask.archiveFile.get().asFile
        if (!fatJar.isFile()) {
            throw new GradleException("NeoForge fat jar is missing: ${fatJar}")
        }
        copy {
            from fatJar
            into modsDestinationDir
            rename { "${mod_id}-${modsJarVersion}-all.jar" }
        }
    }
    tasks.named('jarAll').configure { dependsOn fatTask }
    tasks.named('assemble').configure { dependsOn fatTask }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
