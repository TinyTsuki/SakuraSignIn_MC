pluginManagement {
    repositories {
        def verifiedRepository = providers.gradleProperty('banira.neoForgeDependencyRepo').orNull
        if (verifiedRepository != null) {
            maven {
                url = uri(verifiedRepository)
                metadataSources {
                    gradleMetadata()
                    mavenPom()
                }
            }
        }
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'sakura-sign-in'

apply from: 'gradle/config-view-processor-settings.gradle'
