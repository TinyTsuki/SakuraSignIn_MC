import java.util.zip.ZipFile

def optionalRuntimeEnabled = providers.gradleProperty('banira.devOptionalRuntime').getOrElse('false').toBoolean()
def optionalRuntimePins = []
if (optionalRuntimeEnabled) {
    def path = providers.gradleProperty('banira.devOptionalRuntimePins').orNull
    def receiptFile = path == null ? null : new File(path)
    if (receiptFile == null || !receiptFile.isAbsolute() || !receiptFile.isFile()) {
        throw new GradleException('Optional development runtime needs a verified 26.1 receipt')
    }
    def receipt = new groovy.json.JsonSlurper().parse(receiptFile, 'UTF-8')
    if (receipt.targetMinecraft != project.minecraft_version || !(receipt.artifacts instanceof List) || receipt.artifacts.empty) {
        throw new GradleException('Optional development runtime receipt must target the exact Minecraft version')
    }
    optionalRuntimePins = receipt.artifacts
    optionalRuntimePins.each { pin ->
        if (!(pin.declaredGameVersions instanceof List) || !pin.declaredGameVersions.contains(project.minecraft_version)
                || pin.distributionSha1AndSha512Verified != true || !(pin.sha256 ==~ /(?i)[0-9a-f]{64}/)
                || !(pin.project instanceof String) || !(pin.gav instanceof String) || pin.gav.split(':').length != 3) {
            throw new GradleException('Optional development runtime requires verified exact-version artifacts')
        }
    }
}
ext.baniraDevOptionalRuntimeProjects = optionalRuntimePins.collect { it.project }
def optionalRuntimeLibraries = configurations.create('baniraDevOptionalRuntimeLibraries') {
    canBeConsumed = false
    transitive = false
}
optionalRuntimePins.each { pin -> dependencies.add(optionalRuntimeLibraries.name, pin.gav) }
dependencies.add('localRuntime', files(optionalRuntimeLibraries))

def verifyOptionalRuntime = tasks.register('verifyDevOptionalRuntimePins') {
    inputs.files(optionalRuntimeLibraries)
    inputs.property('pins', groovy.json.JsonOutput.toJson(optionalRuntimePins))
    doLast {
        def artifacts = optionalRuntimeLibraries.resolvedConfiguration.resolvedArtifacts
        optionalRuntimePins.each { pin ->
            def artifact = artifacts.find { it.moduleVersion.id.toString() == pin.gav }
            if (artifact == null) throw new GradleException("Missing optional development runtime artifact: ${pin.gav}")
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
            if (!hash.equalsIgnoreCase(pin.sha256)) throw new GradleException("Optional development runtime SHA-256 mismatch: ${pin.gav}")
        }
    }
}
tasks.matching { it.name in ['runClient', 'runServer', 'ideaSyncTask'] }.configureEach {
    dependsOn verifyOptionalRuntime
}

// Development libraries are separate from the player's manually installed mods.
def devLibrariesDirectory = layout.buildDirectory.dir("dev-runtime-libraries/${minecraft_version}").get().asFile
def prepareDevLibraries = tasks.register('prepareDevRuntimeLibraries', Sync) {
    group = 'verification'
    description = 'Prepares version-isolated nested libraries for the development client.'
    dependsOn verifyOptionalRuntime
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({
        configurations.runtimeClasspath.files
                .findAll { artifact -> artifact.name.startsWith('sodium') || artifact.name.startsWith('AANobbMI') }
                .collect { artifact -> zipTree(artifact) }
    }) {
        include 'META-INF/jars/*.jar'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into devLibrariesDirectory
}

def extraModsDirectories = optionalRuntimeEnabled ? [devLibrariesDirectory] : []
if (project.hasProperty('minimapSmoke')) {
    def mapLibrariesDirectory = file("run/minimap-smoke-libraries/${minecraft_version}/${project.property('minimapSmoke') ?: 'xaero'}")
    def prepareMapLibraries = tasks.register('prepareDevMinimapLibraries', Sync) {
        group = 'verification'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from({
            configurations.runtimeClasspath.files
                    .findAll { artifact -> artifact.name.startsWith('xaero') || artifact.name.startsWith('journeymap') }
                    .collect { artifact -> zipTree(artifact) }
        }) {
            include 'META-INF/jars/*.jar'
            eachFile { details -> details.path = details.name }
            includeEmptyDirs = false
        }
        into mapLibrariesDirectory
    }
    extraModsDirectories.add(mapLibrariesDirectory)
    tasks.matching { task -> task.name == 'runClient' || task.name == 'ideaSyncTask' }.configureEach {
        dependsOn prepareMapLibraries
    }
}
if (!extraModsDirectories.empty) {
    loom.runs.client.property 'fabric.addMods', extraModsDirectories.collect { it.absolutePath }.join(File.pathSeparator)
}
// IDEA uses the Gradle launch path so clean builds also prepare these libraries.
loom.runs.client.preferGradleTask.set(true)

// Only move byte-identical nested libraries previously generated by this build.
def isolateLegacyDevLibraries = {
    def fingerprints = [:].withDefault { new HashSet<String>() }
    def digest = { stream -> java.security.MessageDigest.getInstance('SHA-256').digest(stream.readAllBytes()).encodeHex().toString() }
    def cacheRoot = new File(gradle.gradleUserHomeDir, 'caches/modules-2/files-2.1')
    ['maven.modrinth/sodium', 'maven.modrinth/sodium-extra', 'maven.modrinth/AANobbMI', 'curse.maven/sodium-394468'].each { coordinate ->
        def module = new File(cacheRoot, coordinate)
        if (module.isDirectory()) fileTree(module).matching { include '**/*.jar' }.files.each { artifact ->
            new ZipFile(artifact).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (entry.name.startsWith('META-INF/jars/') && entry.name.endsWith('.jar')) {
                        zip.getInputStream(entry).withCloseable { stream -> fingerprints[new File(entry.name).name].add(digest(stream)) }
                    }
                }
            }
        }
    }
    def backup = file('.gradle/banira/dev-runtime-backup')
    def legacyDirectories = [file('run/mods'), file('run-network-smoke/client/mods')]
    def sessions = file('run-network-smoke/sessions')
    sessions.listFiles()?.findAll { it.isDirectory() }?.each { session -> legacyDirectories.add(new File(session, 'client/mods')) }
    legacyDirectories.findAll { it.isDirectory() }.each { legacy ->
        legacy.listFiles()?.findAll { it.isFile() && fingerprints.containsKey(it.name) }?.each { artifact ->
            def hash = artifact.withInputStream { stream -> digest(stream) }
            if (fingerprints[artifact.name].contains(hash)) {
                def target = new File(backup, hash + '/' + artifact.name)
                target.parentFile.mkdirs()
                java.nio.file.Files.move(artifact.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                logger.lifecycle("Backed up generated legacy development library: ${artifact.name}")
            }
        }
    }
}
def isolateLegacy = tasks.register('isolateLegacyDevRuntimeLibraries') {
    group = 'verification'
    doLast isolateLegacyDevLibraries
}
prepareDevLibraries.configure { dependsOn isolateLegacy }
tasks.matching { task -> task.name == 'runClient' || task.name == 'ideaSyncTask' }.configureEach {
    dependsOn prepareDevLibraries
}

tasks.register('verifyDevRuntimeLibraries') {
    group = 'verification'
    dependsOn prepareDevLibraries
    doLast {
        def jars = devLibrariesDirectory.listFiles()?.findAll { it.name.endsWith('.jar') } ?: []
        jars.each { artifact ->
            new ZipFile(artifact).withCloseable { zip ->
                if (zip.getEntry('fabric.mod.json') == null && zip.getEntry('META-INF/MANIFEST.MF') == null)
                    throw new GradleException("Invalid development runtime library: ${artifact.name}")
            }
        }
    }
}
